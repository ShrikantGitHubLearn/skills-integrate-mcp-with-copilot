<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
        <div class="account-area">
          <button
            id="teacher-account-button"
            class="account-button"
            type="button"
            aria-label="Teacher account"
            aria-expanded="false"
            aria-controls="teacher-account-menu"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="8" r="3.5"></circle>
              <path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
            </svg>
          </button>
          <div id="teacher-account-menu" class="account-menu" hidden>
            <p id="teacher-account-status">Not signed in</p>
            <button id="open-login-button" type="button">Log in as teacher</button>
            <button id="logout-button" type="button" hidden>Log out</button>
          </div>
        </div>
      </div>
    </header>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <div class="dialog-heading">
          <h2 id="login-title">Teacher login</h2>
          <button id="close-login-button" class="dialog-close" type="button" aria-label="Close login">&times;</button>
        </div>
        <label for="teacher-username">Username</label>
        <input id="teacher-username" name="username" autocomplete="username" required />
        <label for="teacher-password">Password</label>
        <input id="teacher-password" name="password" type="password" autocomplete="current-password" required />
        <p id="login-message" class="error hidden" role="alert"></p>
        <button type="submit">Log in</button>
      </form>
    </dialog>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <p id="teacher-required-message" class="info" role="status" hidden>
        Teacher login is required to register or unregister students.
      </p>

      <section id="signup-container" hidden>
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
